name: Test

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: brew install libarchive xz zstd lz4 libb2 sevenzip pkg-config
      - name: Download helpers
        run: ./Scripts/build-helpers.sh
      - name: Run tests
        run: ./Scripts/test.sh
