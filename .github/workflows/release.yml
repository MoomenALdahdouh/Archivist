name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: brew install libarchive xz zstd lz4 libb2 sevenzip pkg-config
      - name: Build app and disk image
        run: ./Scripts/release.sh
      - name: Upload disk image
        uses: actions/upload-artifact@v4
        with:
          name: Archivist-dmg
          path: dist/Archivist-*.dmg
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Archivist-*.dmg
          generate_release_notes: true
          body: |
            Drag Archivist into Applications. The first time you open it, right-click the app and choose Open.

            This build is for Apple Silicon Macs on macOS 14 or later. It is ad-hoc signed (not notarized).
